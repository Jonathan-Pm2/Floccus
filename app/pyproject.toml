[project]
name = "floccus-app"
version = "0.4.3"
description = "Floccus app: local interface to run LLM-assisted systematic-review screening on any topic"
readme = "README.md"
authors = [
    { name = "Jonathan Josué Proaño Morales" }
]
requires-python = ">=3.12"
dependencies = [
    "biofloc-review",
    "hdbscan>=0.8",
    "pandas>=2",
    "plotly>=6",
    "pyyaml>=6.0",
    "qdrant-client>=1.18",
    "scikit-learn>=1.3",
    "streamlit>=1.40",
    "umap-learn>=0.5",
]

[project.scripts]
floccus = "floccus_app.cli:main"

[tool.uv.sources]
biofloc-review = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
