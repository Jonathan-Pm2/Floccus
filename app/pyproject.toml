[project]
name = "floccus-app"
version = "0.1.0"
description = "Floccus app: local interface to run LLM-assisted systematic-review screening on any topic"
readme = "README.md"
authors = [
    { name = "Jonathan Josué Proaño Morales" }
]
requires-python = ">=3.12"
dependencies = [
    "biofloc-review",
    "pyyaml>=6.0",
]

[project.scripts]
floccus = "floccus_app.cli:main"

[tool.uv.sources]
biofloc-review = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
