[project]
name = "biofloc-review"
version = "0.3.0"
description = "Floccus: LLM-assisted, criterion-wise screening pipeline for systematic reviews (biofloc modelling case study)"
readme = "README.md"
authors = [
    { name = "Jonathan Josué Proaño Morales" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "langdetect>=1.0.9",
    "langgraph>=1.2.2",
    "lxml>=6.1.1",
    "matplotlib>=3.10.9",
    "networkx>=3.7",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "playwright>=1.60.0",
    "pyalex>=0.21",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client>=1.18.0",
    "rapidfuzz>=3.14.5",
    "seaborn>=0.13.2",
    "tenacity>=9.1.4",
    "xlrd>=2.0.2",
]

[project.scripts]
biofloc-review = "biofloc_review:main"

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
