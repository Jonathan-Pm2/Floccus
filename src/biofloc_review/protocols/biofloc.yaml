# Published Floccus protocol (biofloc modelling review). Do not edit:
# tests pin it to the criteria used for the published results.
name: biofloc
language: es
topic: modelado de flóculos biológicos en sistemas acuáticos
criteria:
- id: I1
  type: inclusion
  question: ¿El artículo aborda flóculos microbianos, biofloc, lodos activados, perifiton o agregados
    bacterianos como objeto de estudio?
  justification: Define el dominio biológico de la revisión.
- id: I2
  type: inclusion
  question: '¿El artículo presenta, aplica, valida o discute al menos un modelo matemático, ecuación,
    simulación numérica o expresión cuantitativa formal para describir el comportamiento del sistema biológico?
    (La palabra "modelo" sola no basta: tiene que haber matemática real — ecuaciones diferenciales, cinéticas
    tipo Monod, balances de masa, simulaciones CFD, modelos poblacionales, ASM, etc.)'
  justification: 'Criterio clave: filtra papers donde ''modelo'' es retórico.'
- id: I3
  type: inclusion
  question: '¿El contexto es acuático/biológico aplicado: acuicultura, tratamiento de aguas residuales,
    tratamiento de agua, sistemas de cultivo, biorreactores o calidad del agua?'
  justification: Filtra fuera contextos no aplicables (suelo, atmósfera, clínico).
- id: I4
  type: inclusion
  question: ¿Es un artículo original de revista (research article) o una revisión (review)?
  justification: 'Coherente con PRISMA: excluye editoriales, cartas, actas.'
  check: document_type
- id: E1
  type: exclusion
  question: ¿El término 'modelo' se refiere únicamente a un organismo modelo (ej. 'rat model', 'mouse
    model', 'fish as model organism') y NO a modelación matemática?
  justification: 'Captura falso positivo más probable: animal modelo vs modelo matemático.'
- id: E2
  type: exclusion
  question: ¿El estudio es puramente experimental/empírico SIN componente cuantitativo formal de modelación
    (solo reporta mediciones, sin ecuaciones ni simulaciones)?
  justification: Descarta estudios solo descriptivos.
  positive_question: ¿El estudio incluye algún componente cuantitativo formal de modelación (ecuaciones,
    modelos matemáticos o simulaciones), y no solo el reporte de mediciones?
- id: E3
  type: exclusion
  question: "¿El SISTEMA PRINCIPAL bajo estudio se encuentra FUERA de un medio acuoso?\n\nResponder YES\
    \ (excluir) solo si el estudio se realiza sobre material o sistema NO acuoso: suelo, atmósfera abierta,\
    \ alimentos sólidos, tejido clínico humano, fármacos sólidos o procesos industriales secos.\n\nResponder\
    \ NO si el sistema principal es una planta de tratamiento de aguas residuales (PTAR/WWTP/STP), un\
    \ sistema acuícola o un biorreactor de suspensión líquida — incluso cuando el artículo:\n  - reporte\
    \ emisiones de gases (GHG, CO2, CH4, N2O) generadas POR la planta acuosa,\n  - describa tratamiento\
    \ de lixiviados (landfill leachate) que ingresan a la planta,\n  - mencione contexto 'industrial'\
    \ referido a aguas o efluentes industriales.\n\nLo decisivo es DÓNDE ocurre el sistema biológico bajo\
    \ estudio."
  justification: 'Refuerza el dominio acuático. Calibrado tras pilot n=100 (2026-05-30): el prompt original
    llevaba al modelo a confundir menciones colaterales de GHG/landfill/industrial con el contexto primario
    del estudio (5/100 falsos positivos identificados). El prompt actual explicita que lo decisivo es
    la localización del sistema biológico estudiado, no las palabras que aparecen en el abstract.'
- id: E4
  type: exclusion
  question: ¿El estudio trata de coagulación/floculación química pura (con coagulantes inorgánicos como
    alumbre, cloruro férrico) SIN componente microbiológico/biológico?
  justification: Interés es flóculos BIOLÓGICOS, no químicos de potabilización.
- id: D1
  type: derivation
  question: ¿El abstract es muy breve (<100 palabras) y no permite decidir con confianza?
  justification: Falta de información suficiente — preservar para revisión humana.
  check: abstract_too_short
  params:
    min_words: 100
- id: D2
  type: derivation
  question: ¿El artículo menciona modelación pero el tipo de modelo NO es claro (¿matemático? ¿conceptual?
    ¿in silico estadístico?)?
  justification: 'Ambigüedad sobre I2: preservar para revisión humana.'
- id: D3
  type: derivation
  question: ¿El artículo toca biofloc/lodos pero en un contexto mixto (ej. parte agua + parte suelo)?
  justification: 'Ambigüedad sobre I3: preservar para revisión humana.'
